name: CI

# Проверки на каждый коммит: сборка и тесты. Релиз здесь не создаётся — за него
# отвечает release.yml, который срабатывает только на теге.
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Восстановление пакетов
        run: dotnet restore TrainingLog.sln

      - name: Сборка
        run: dotnet build TrainingLog.sln -c Release --no-restore

      - name: Тесты
        run: dotnet test TrainingLog.sln -c Release --no-build
